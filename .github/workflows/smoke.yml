name: Smoke

on:
  schedule:
    # Every 15 minutes. GitHub may delay scheduled runs under load, so this is a
    # convenience watchdog; the Cloud Monitoring policies are the primary alert.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # No install step: this script uses only the Node standard library, so a
      # failure here is the site, not the dependency tree.
      - run: node scripts/smoke.mjs
        env:
          SMOKE_ORIGIN: https://windies-truck-tracker.web.app
          SMOKE_BAND: fog-angels
